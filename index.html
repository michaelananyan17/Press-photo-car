<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Press Photo Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        
        .left-panel {
            flex: 1;
            min-width: 300px;
        }
        
        .right-panel {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
            width: 100%;
        }
        
        .description {
            text-align: center;
            margin-bottom: 30px;
            color: #7f8c8d;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            background-color: #fff;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        
        .api-key-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .result-section {
            margin-top: 30px;
            text-align: center;
            width: 100%;
        }
        
        .car-image {
            max-width: 100%;
            max-height: 500px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            display: none;
        }
        
        .loading {
            display: none;
            margin: 20px 0;
            text-align: center;
        }
        
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            color: #e74c3c;
            margin-top: 10px;
            display: none;
        }
        
        .success-message {
            color: #27ae60;
            margin-top: 10px;
            display: none;
        }
        
        .file-upload-section {
            margin-bottom: 20px;
            padding: 15px;
            border: 2px dashed #ddd;
            border-radius: 5px;
            text-align: center;
        }
        
        .file-upload-section.active {
            border-color: #3498db;
            background-color: #f0f8ff;
        }
        
        .file-input {
            display: none;
        }
        
        .file-label {
            display: block;
            padding: 10px;
            cursor: pointer;
            color: #3498db;
            font-weight: 600;
        }
        
        .file-name {
            margin-top: 10px;
            font-size: 14px;
            color: #7f8c8d;
        }
        
        .instructions {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 5px;
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .left-panel, .right-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Car Press Photo Generator</h1>
        <p class="description">Upload a car dataset and generate a press photo with no background using the Gemini API</p>
        
        <div class="left-panel">
            <div class="file-upload-section" id="file-upload-section">
                <label for="csv-file" class="file-label">Click to upload car dataset (CSV)</label>
                <input type="file" id="csv-file" class="file-input" accept=".csv">
                <div class="file-name" id="file-name">No file selected</div>
                <div class="instructions">CSV should have columns: car brand, car model, manufacturing year</div>
            </div>
            
            <div class="form-group">
                <label for="brand">Car Manufacturer</label>
                <select id="brand" disabled>
                    <option value="">Select a manufacturer</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="model">Car Model</label>
                <select id="model" disabled>
                    <option value="">Select a model</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="year">Manufacturing Year</label>
                <select id="year" disabled>
                    <option value="">Select a year</option>
                </select>
            </div>
            
            <div class="api-key-section">
                <label for="api-key">Gemini API Key</label>
                <input type="password" id="api-key" placeholder="Enter your Gemini API key">
                <button id="submit-api-key">Submit API Key</button>
                <div id="api-key-message" class="success-message">API key submitted successfully!</div>
            </div>
            
            <button id="generate-button" disabled>Generate My Car</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Generating your car photo...</p>
            </div>
            
            <div class="result-section">
                <div id="error-message" class="error-message"></div>
            </div>
        </div>
        
        <div class="right-panel">
            <img id="car-image" class="car-image" alt="Generated car photo">
        </div>
    </div>

    <script>
        // Global variables
        let carData = [];
        let apiKey = '';
        
        // DOM elements
        const fileUploadSection = document.getElementById('file-upload-section');
        const csvFileInput = document.getElementById('csv-file');
        const fileNameDisplay = document.getElementById('file-name');
        const brandSelect = document.getElementById('brand');
        const modelSelect = document.getElementById('model');
        const yearSelect = document.getElementById('year');
        const apiKeyInput = document.getElementById('api-key');
        const submitApiKeyButton = document.getElementById('submit-api-key');
        const apiKeyMessage = document.getElementById('api-key-message');
        const generateButton = document.getElementById('generate-button');
        const loadingIndicator = document.getElementById('loading');
        const errorMessage = document.getElementById('error-message');
        const carImage = document.getElementById('car-image');
        
        // File upload handling
        csvFileInput.addEventListener('change', handleFileUpload);
        
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            fileNameDisplay.textContent = file.name;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const csvContent = e.target.result;
                    parseCSVData(csvContent);
                } catch (error) {
                    showError('Error parsing CSV file: ' + error.message);
                }
            };
            reader.readAsText(file);
        }
        
        function parseCSVData(csvContent) {
            // Reset car data
            carData = [];
            
            // Split CSV into lines
            const lines = csvContent.split('\n');
            
            // Check if we have at least a header and one data row
            if (lines.length < 2) {
                showError('CSV file must contain at least a header and one data row');
                return;
            }
            
            // Parse header to find column indices
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            const brandIndex = headers.indexOf('car brand');
            const modelIndex = headers.indexOf('car model');
            const yearIndex = headers.indexOf('manufacturing year');
            
            if (brandIndex === -1 || modelIndex === -1 || yearIndex === -1) {
                showError('CSV must contain columns: car brand, car model, manufacturing year');
                return;
            }
            
            // Parse data rows
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const values = line.split(',').map(v => v.trim());
                
                if (values.length >= Math.max(brandIndex, modelIndex, yearIndex) + 1) {
                    const brand = values[brandIndex];
                    const model = values[modelIndex];
                    const year = parseInt(values[yearIndex]);
                    
                    if (brand && model && !isNaN(year)) {
                        carData.push({
                            brand: brand.toLowerCase(),
                            model: model.toLowerCase(),
                            year: year
                        });
                    }
                }
            }
            
            if (carData.length === 0) {
                showError('No valid car data found in CSV');
                return;
            }
            
            // Populate dropdowns
            populateDropdowns();
            clearError();
            
            // Enable brand selection
            brandSelect.disabled = false;
        }
        
        function populateDropdowns() {
            // Clear existing options
            brandSelect.innerHTML = '<option value="">Select a manufacturer</option>';
            modelSelect.innerHTML = '<option value="">Select a model</option>';
            yearSelect.innerHTML = '<option value="">Select a year</option>';
            
            // Get unique brands
            const brands = [...new Set(carData.map(car => car.brand))].sort();
            brands.forEach(brand => {
                const option = document.createElement('option');
                option.value = brand;
                option.textContent = brand.charAt(0).toUpperCase() + brand.slice(1);
                brandSelect.appendChild(option);
            });
        }
        
        // Brand selection handler
        brandSelect.addEventListener('change', function() {
            const selectedBrand = this.value;
            
            // Clear model and year dropdowns
            modelSelect.innerHTML = '<option value="">Select a model</option>';
            yearSelect.innerHTML = '<option value="">Select a year</option>';
            modelSelect.disabled = true;
            yearSelect.disabled = true;
            
            if (!selectedBrand) return;
            
            // Get models for selected brand
            const models = [...new Set(carData
                .filter(car => car.brand === selectedBrand)
                .map(car => car.model))].sort();
            
            models.forEach(model => {
                const option = document.createElement('option');
                option.value = model;
                option.textContent = model.charAt(0).toUpperCase() + model.slice(1);
                modelSelect.appendChild(option);
            });
            
            modelSelect.disabled = false;
        });
        
        // Model selection handler
        modelSelect.addEventListener('change', function() {
            const selectedBrand = brandSelect.value;
            const selectedModel = this.value;
            
            // Clear year dropdown
            yearSelect.innerHTML = '<option value="">Select a year</option>';
            yearSelect.disabled = true;
            
            if (!selectedBrand || !selectedModel) return;
            
            // Get years for selected brand and model
            const years = [...new Set(carData
                .filter(car => car.brand === selectedBrand && car.model === selectedModel)
                .map(car => car.year))].sort((a, b) => a - b);
            
            years.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelect.appendChild(option);
            });
            
            yearSelect.disabled = false;
        });
        
        // Year selection handler
        yearSelect.addEventListener('change', function() {
            updateGenerateButtonState();
        });
        
        // API key submission
        submitApiKeyButton.addEventListener('click', function() {
            apiKey = apiKeyInput.value.trim();
            
            if (!apiKey) {
                showError('Please enter your Gemini API key');
                return;
            }
            
            // In a real application, you might want to validate the API key here
            apiKeyMessage.style.display = 'block';
            clearError();
            updateGenerateButtonState();
        });
        
        // Generate button handler
        generateButton.addEventListener('click', generateCarPhoto);
        
        function updateGenerateButtonState() {
            const hasValidSelection = brandSelect.value && modelSelect.value && yearSelect.value;
            generateButton.disabled = !(hasValidSelection && apiKey);
        }
        
        function generateCarPhoto() {
            const brand = brandSelect.value;
            const model = modelSelect.value;
            const year = yearSelect.value;
            
            if (!brand || !model || !year || !apiKey) {
                showError('Please complete all selections and provide an API key');
                return;
            }
            
            // Show loading indicator
            loadingIndicator.style.display = 'block';
            carImage.style.display = 'none';
            clearError();
            
            // Prepare prompt for Gemini API
            const prompt = `Generate a professional press photo of a ${year} ${brand} ${model} car with a transparent background. The car should be shown from a 3/4 front angle, well-lit, with professional studio lighting.`;
            
            // Call Gemini API (this is a simplified example)
            // In a real implementation, you would make an actual API call to Gemini
            simulateGeminiAPICall(prompt, brand, model, year);
        }
        
        // This function simulates the Gemini API call
        // In a real implementation, you would replace this with actual API code
        function simulateGeminiAPICall(prompt, brand, model, year) {
            // Simulate API processing time
            setTimeout(() => {
                // Hide loading indicator
                loadingIndicator.style.display = 'none';
                
                // In a real implementation, you would use the actual image URL from the API response
                // For this demo, we'll use a placeholder
                const placeholderImageUrl = `https://via.placeholder.com/600x400/3498db/ffffff?text=${encodeURIComponent(`${year} ${brand} ${model}`)}`;
                
                // Display the image
                carImage.src = placeholderImageUrl;
                carImage.style.display = 'block';
                
                // In a real implementation, you would handle API errors here
                // For example:
                // if (apiResponse.error) {
                //     showError('API Error: ' + apiResponse.error.message);
                // } else {
                //     carImage.src = apiResponse.imageUrl;
                //     carImage.style.display = 'block';
                // }
            }, 2000);
        }
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }
        
        function clearError() {
            errorMessage.style.display = 'none';
        }
        
        // Drag and drop functionality for file upload
        fileUploadSection.addEventListener('dragover', function(e) {
            e.preventDefault();
            fileUploadSection.classList.add('active');
        });
        
        fileUploadSection.addEventListener('dragleave', function() {
            fileUploadSection.classList.remove('active');
        });
        
        fileUploadSection.addEventListener('drop', function(e) {
            e.preventDefault();
            fileUploadSection.classList.remove('active');
            
            if (e.dataTransfer.files.length) {
                csvFileInput.files = e.dataTransfer.files;
                handleFileUpload({ target: { files: e.dataTransfer.files } });
            }
        });
    </script>
</body>
</html>
