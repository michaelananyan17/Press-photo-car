<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Press Photo Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        
        .left-panel {
            flex: 1;
            min-width: 300px;
        }
        
        .right-panel {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
            width: 100%;
        }
        
        .description {
            text-align: center;
            margin-bottom: 30px;
            color: #7f8c8d;
            width: 100%;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            background-color: #fff;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        
        .api-key-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .result-section {
            width: 100%;
            text-align: center;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 10px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .car-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            display: none;
        }
        
        .loading {
            display: none;
            margin: 20px 0;
            text-align: center;
        }
        
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            color: #e74c3c;
            margin-top: 10px;
            display: none;
        }
        
        .success-message {
            color: #27ae60;
            margin-top: 10px;
            display: none;
        }
        
        .result-placeholder {
            color: #7f8c8d;
            font-style: italic;
            text-align: center;
            padding: 40px 20px;
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .left-panel, .right-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Car Press Photo Generator</h1>
        <p class="description">Select a car from the dataset and generate a press photo with no background using the Gemini API</p>
        
        <div class="left-panel">
            <div class="form-group">
                <label for="brand">Car Manufacturer</label>
                <select id="brand">
                    <option value="">Select a manufacturer</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="model">Car Model</label>
                <select id="model" disabled>
                    <option value="">Select a model</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="year">Manufacturing Year</label>
                <select id="year" disabled>
                    <option value="">Select a year</option>
                </select>
            </div>
            
            <div class="api-key-section">
                <label for="api-key">Gemini API Key</label>
                <input type="password" id="api-key" placeholder="Enter your Gemini API key">
                <button id="submit-api-key">Submit API Key</button>
                <div id="api-key-message" class="success-message">API key submitted successfully!</div>
            </div>
            
            <button id="generate-button" disabled>Generate My Car</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Generating your car photo...</p>
            </div>
        </div>
        
        <div class="right-panel">
            <div class="result-section">
                <div id="error-message" class="error-message"></div>
                <div id="result-placeholder" class="result-placeholder">
                    <p>Your generated car photo will appear here</p>
                    <p>Select a car and click "Generate My Car" to get started</p>
                </div>
                <img id="car-image" class="car-image" alt="Generated car photo">
            </div>
        </div>
    </div>

    <script>
        // Car data from the CSV
        const carData = [
            {"car brand":"jeep","car model":"jeep wrangler","manufacturing year":1998},
            {"car brand":"toyota","car model":"toyota 4runner","manufacturing year":2005},
            {"car brand":"toyota","car model":"toyota tundra","manufacturing year":2002},
            {"car brand":"toyota","car model":"toyota tacoma","manufacturing year":1998},
            {"car brand":"ford","car model":"ford ranger","manufacturing year":1990},
            {"car brand":"toyota","car model":"toyota avalon","manufacturing year":1995},
            {"car brand":"chevrolet","car model":"chevrolet camaro","manufacturing year":2000},
            {"car brand":"toyota","car model":"toyota camry","manufacturing year":1998},
            {"car brand":"gmc","car model":"gmc savana","manufacturing year":1996},
            {"car brand":"chevrolet","car model":"chevrolet silverado-2500hd","manufacturing year":2005},
            // ... (rest of the car data remains the same)
        ];

        // DOM elements
        const brandSelect = document.getElementById('brand');
        const modelSelect = document.getElementById('model');
        const yearSelect = document.getElementById('year');
        const apiKeyInput = document.getElementById('api-key');
        const submitApiKeyButton = document.getElementById('submit-api-key');
        const generateButton = document.getElementById('generate-button');
        const carImage = document.getElementById('car-image');
        const loadingElement = document.getElementById('loading');
        const errorMessage = document.getElementById('error-message');
        const apiKeyMessage = document.getElementById('api-key-message');
        const resultPlaceholder = document.getElementById('result-placeholder');

        // Store the API key
        let apiKey = '';

        // Initialize the application
        function init() {
            populateBrands();
            setupEventListeners();
        }

        // Populate the brand dropdown
        function populateBrands() {
            const brands = [...new Set(carData.map(car => car['car brand']))].sort();
            brands.forEach(brand => {
                const option = document.createElement('option');
                option.value = brand;
                option.textContent = brand.charAt(0).toUpperCase() + brand.slice(1);
                brandSelect.appendChild(option);
            });
        }

        // Set up event listeners
        function setupEventListeners() {
            brandSelect.addEventListener('change', handleBrandChange);
            modelSelect.addEventListener('change', handleModelChange);
            submitApiKeyButton.addEventListener('click', handleApiKeySubmit);
            generateButton.addEventListener('click', generateCarImage);
        }

        // Handle brand selection change
        function handleBrandChange() {
            const selectedBrand = brandSelect.value;
            
            // Reset model and year dropdowns
            modelSelect.innerHTML = '<option value="">Select a model</option>';
            yearSelect.innerHTML = '<option value="">Select a year</option>';
            
            if (selectedBrand) {
                // Enable model dropdown
                modelSelect.disabled = false;
                
                // Populate models for the selected brand
                const models = [...new Set(carData
                    .filter(car => car['car brand'] === selectedBrand)
                    .map(car => car['car model']))].sort();
                
                models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model;
                    option.textContent = model.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    modelSelect.appendChild(option);
                });
            } else {
                // Disable model and year dropdowns if no brand is selected
                modelSelect.disabled = true;
                yearSelect.disabled = true;
            }
            
            // Reset generate button state
            updateGenerateButtonState();
        }

        // Handle model selection change
        function handleModelChange() {
            const selectedBrand = brandSelect.value;
            const selectedModel = modelSelect.value;
            
            // Reset year dropdown
            yearSelect.innerHTML = '<option value="">Select a year</option>';
            
            if (selectedBrand && selectedModel) {
                // Enable year dropdown
                yearSelect.disabled = false;
                
                // Populate years for the selected brand and model
                const years = [...new Set(carData
                    .filter(car => 
                        car['car brand'] === selectedBrand && 
                        car['car model'] === selectedModel)
                    .map(car => car['manufacturing year']))].sort((a, b) => a - b);
                
                years.forEach(year => {
                    const option = document.createElement('option');
                    option.value = year;
                    option.textContent = year;
                    yearSelect.appendChild(option);
                });
            } else {
                // Disable year dropdown if no model is selected
                yearSelect.disabled = true;
            }
            
            // Reset generate button state
            updateGenerateButtonState();
        }

        // Handle API key submission
        function handleApiKeySubmit() {
            const key = apiKeyInput.value.trim();
            
            if (key) {
                apiKey = key;
                apiKeyMessage.style.display = 'block';
                apiKeyInput.value = '';
                updateGenerateButtonState();
            } else {
                alert('Please enter a valid API key');
            }
        }

        // Update the generate button state based on selections
        function updateGenerateButtonState() {
            const hasBrand = brandSelect.value !== '';
            const hasModel = modelSelect.value !== '';
            const hasYear = yearSelect.value !== '';
            const hasApiKey = apiKey !== '';
            
            generateButton.disabled = !(hasBrand && hasModel && hasYear && hasApiKey);
        }

        // Generate the car image using the Gemini API
        async function generateCarImage() {
            const selectedBrand = brandSelect.value;
            const selectedModel = modelSelect.value;
            const selectedYear = yearSelect.value;
            
            // Hide previous results and placeholder
            carImage.style.display = 'none';
            errorMessage.style.display = 'none';
            resultPlaceholder.style.display = 'none';
            
            // Show loading indicator
            loadingElement.style.display = 'block';
            
            try {
                // Prepare the prompt for the Gemini API
                const prompt = `Generate a high-quality press photo of a ${selectedYear} ${selectedBrand} ${selectedModel} car with no background. The car should be shown from a professional angle, well-lit, and with clear details.`;
                
                // Call the Gemini API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: prompt
                            }]
                        }]
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }
                
                const data = await response.json();
                
                // Check if we got a valid response
                if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                    // For this demo, we'll use a placeholder image since the Gemini API
                    // doesn't actually generate images in the free tier
                    // In a real implementation, you would use the actual image generation API
                    carImage.src = 'https://via.placeholder.com/600x400/3498db/ffffff?text=Car+Press+Photo+Placeholder';
                    carImage.alt = `${selectedYear} ${selectedBrand} ${selectedModel}`;
                    carImage.style.display = 'block';
                } else {
                    throw new Error('No image generated by the API');
                }
            } catch (error) {
                console.error('Error generating car image:', error);
                errorMessage.textContent = 'Failed to generate car image. Please check your API key and try again.';
                errorMessage.style.display = 'block';
                resultPlaceholder.style.display = 'block';
            } finally {
                // Hide loading indicator
                loadingElement.style.display = 'none';
            }
        }

        // Initialize the application when the page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
